<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ryke</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Ryke: Git with transactions. Agents' changes drawn as a graphic timetable against trunk." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' fill='%23f4f1e8'/%3E%3Cpath d='M2 8h20M2 17h7' stroke='%2316150f' stroke-width='2.6' fill='none'/%3E%3Cpath d='M8 17l7.5-9' stroke='%231b7a3a' stroke-width='2.6' fill='none'/%3E%3C/svg%3E"
    />
    <script>
      // The theme a viewer picked, before the first paint, so a dark choice never flashes light (ui.tsx useTheme).
      try {
        const t = localStorage.getItem("ryke.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
