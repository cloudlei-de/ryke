<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ryke</title>
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Ryke: Git with transactions. Watch agents' changes land on trunk." />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6.5' fill='%2316161b'/%3E%3Cpath d='M5 8.5h14' stroke='%23fff' stroke-width='2.2' stroke-linecap='round'/%3E%3Cpath d='M5 16.5h4.2c1.6 0 2.4-.5 3.3-1.8l2.2-3.6c.8-1.4 1.5-2.6 3.3-2.6' stroke='%232ea567' stroke-width='2.2' stroke-linecap='round' fill='none'/%3E%3C/svg%3E"
    />
    <script>
      // The theme a viewer picked, before the first paint, so a dark choice never flashes light (ui.tsx useTheme).
      try {
        const t = localStorage.getItem("ryke.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/web/main.tsx"></script>
  </body>
</html>
